{% extends "base.html" %}
{% block title %}Mein Konto — PROSEMA{% endblock %}
{% block content %}
  <h1>Mein Konto</h1>
  <dl class="facts">
    <dt>Name</dt>
    <dd>{{ user.name }}</dd>
    <dt>E-Mail</dt>
    <dd>{{ user.email }}</dd>
    <dt>Objekt-ID (oid)</dt>
    <dd><code>{{ user.oid }}</code></dd>
    <dt>Rollen</dt>
    <dd><code>{{ roles_json }}</code></dd>
  </dl>
  <section class="job-panel">
    <h2>Hintergrundauftrag</h2>
    <button
      type="button"
      class="btn"
      hx-post="/jobs/noop"
      hx-target="#job-status"
      hx-swap="outerHTML"
    >
      Testlauf starten
    </button>
    <div id="job-status"></div>
  </section>
{% endblock %}
