<div id="batch-grid-panel">
  <div class="d-flex align-items-baseline justify-content-between gap-3 mb-2">
    <p class="mb-0">Gefiltert: {{ total_rows }} Zeilen</p>
    <p id="batch-save-status" class="batch-save-status mb-0" role="status">Gespeichert</p>
  </div>
  <div class="prosema-grid">
    <div id="batch-spreadsheet" class="batch-spreadsheet"></div>
  </div>
  <script type="application/json" id="batch-grid-config">{{ grid_config | tojson }}</script>
  {% if pages > 1 %}
  <nav class="batch-pagination" aria-label="Seiten">
    {% for n in range(1, pages + 1) %}
      {% if n == page %}
      <span class="is-current">{{ n }}</span>
      {% else %}
      {% set qs = filter_qs ~ ('&' if filter_qs else '') ~ 'seite=' ~ n %}
      <a href="/batches/{{ batch.id }}?{{ qs }}">{{ n }}</a>
      {% endif %}
    {% endfor %}
  </nav>
  {% endif %}
</div>
