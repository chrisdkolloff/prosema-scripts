{% if jobs|length == 1 %}
<div class="alert alert-warning licence-banner mb-0 rounded-0" role="status">
  Läuft: {{ job_label }} ({{ jobs[0].created_by_name }}) — weclapp-Lizenz bitte noch nicht übergeben.
  <a href="/jobs/{{ jobs[0].id }}">Auftrag</a>
</div>
{% elif jobs|length > 1 %}
<div class="alert alert-warning licence-banner mb-0 rounded-0" role="status">
  {{ jobs|length }} Aufträge laufen — weclapp-Lizenz bitte noch nicht übergeben.
</div>
{% endif %}
