# Write-mode renumber fixtures. Run with:
#   python tests/eval/run_eval.py --set renumber --provider azure --model gpt-4.1-mini
#   python tests/eval/run_eval.py --set renumber --repeat 3
#
# Requires weclapp token on RENUMBER_EVAL_OID (default: smoke admin oid).

- id: wrong-group-list
  frage: >
    Welche Artikel sind gerade in der falschen Haupt- und Untergruppe — also
    deren Artikelnummer passt nicht zur weclapp-Kategorie?
  expect:
    outcome: answered
    tool: renumber_kandidaten
    scope: all_mismatches
  notes: >
    Must call renumber_kandidaten with scope all_mismatches and summarise
    total_count (verify_numbers). Zero eligible is valid today.

- id: why-ineligible-one
  frage: >
    Warum kann der Artikel 020.060.0010 nicht neu nummeriert werden?
  expect:
    outcome: answered
    tool: renumber_kandidaten
    scope: single
    article_identifier: "020.060.0010"
  notes: >
    Supply source alone is a warning, not a hard block — answer must cite any
    remaining hard check (stock, movement, document, registry, manual alias).

- id: propose-with-live-supply-source
  frage: >
    Bitte nummeriere den Artikel 020.060.0010 neu, damit die Nummer zur
    Kategorie passt.
  expect:
    outcome: answered
    tool: renumber_vorschlagen
    answer_contains: Bezugsquelle
  notes: >
    Should return article_renumber spec when only supply source would have
    blocked before; hinweis_de mentions Bezugsquellen-Warnung / Bestätigung.

- id: refuse-target-number
  frage: >
    Nummeriere den Artikel 020.060.0010 auf 110.020.0150 um.
  expect:
    outcome: refused
    forbid_spec: true
  notes: >
    User-named target must be refused or ignored — no proposal carrying 110.020.0150.

- id: scoped-020120-040050-renumber-backlog
  frage: >
    Ordne allen Artikeln in 040.050 neue Artikelnummern zu, damit die Nummer
    zur weclapp-Kategorie passt. Die Artikel, die betroffen sind, starten mit
    020.120. Wie viele sind das, und warum können sie (noch) nicht umnummeriert
    werden?
  expect:
    outcome: answered
    tool: renumber_kandidaten
    scope: all_mismatches
    quellgruppe: "020.120"
    zielgruppe: "040.050"
    total_count: 20
    answer_contains: "20"
    answer_excludes: "1 derzeit umnummerierbar"
  notes: >
    Must pass quellgruppe/zielgruppe — not unscoped all_mismatches (99 / cap 50).
    Mismatch count 20 in prod ground truth; most were supply-source-only blocks
    before — expect many umnummerierbar with Bezugsquellen-Warnung, or name other
    hard blocks if present.
    Must not answer with the global eligible-only figure (1).

- id: global-mismatch-control
  frage: >
    Wie viele Artikel haben insgesamt eine Artikelnummer, die nicht zur
    weclapp-Kategorie passt — ohne Einschränkung auf eine bestimmte Gruppe?
  expect:
    outcome: answered
    tool: renumber_kandidaten
    scope: all_mismatches
  notes: >
    Control: unscoped all_mismatches; total_count should reflect full catalogue
    mismatch set (order ~90+ on current prod), not the 020.120 slice.
